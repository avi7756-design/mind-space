name: ValueTrack dashboard verification

on:
  push:
    branches:
      - chatgpt/valuetrack-dashboard-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shopping-assistant/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
